# Weekly version updates for the Rust crates and the workflows' actions, as
# pull requests into develop. scripts/check-dco.sh skips Dependabot's commits.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # OxiGuitar's crates (the SDK, the model, the audio crate) are pinned
      # by git tag on purpose (interface 1.4 is frozen) and move together,
      # by hand: Dependabot moved one alone and the build saw two Host types.
      - dependency-name: "oxiguitar-*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
